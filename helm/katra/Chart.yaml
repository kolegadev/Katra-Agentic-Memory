apiVersion: v2
name: katra
description: Cognitive Memory as a Service for AI Agents
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - cognitive-memory
  - ai-agents
  - memory-service
  - mcp
home: https://github.com/kolegadev/Katra-Agentic-Memory
sources:
  - https://github.com/kolegadev/Katra-Agentic-Memory
maintainers:
  - name: Katra maintainers
    # Set this to the maintainer contact for your published chart.
    # No real address may ship in the repo.
    email: maintainer-contact@example.invalid
dependencies:
  - name: mongodb
    version: "~15.6"
    repository: "oci://registry-1.docker.io/bitnamicharts"
    condition: mongodb.enabled
  - name: redis
    version: "~19.6"
    repository: "oci://registry-1.docker.io/bitnamicharts"
    condition: redis.enabled
